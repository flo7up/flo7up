<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Florian Follonier: Applied AI, built end to end</title>
  <desc id="desc">A personal portfolio banner connecting agents, speech, markets, and robotics. The network illustration is decorative.</desc>
  <style>
    :root { color-scheme: light; --cp-surface: #ffffff; --cp-surface-soft: #f5f5f5; --cp-border: #dedede; --cp-text: #242424; --cp-text-muted: #5c5c5c; --cp-accent: #b11f4b; --cp-accent-soft: rgba(177,31,75,0.08); }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --cp-surface: #292929; --cp-surface-soft: #2e2e2e; --cp-border: #474747; --cp-text: #dedede; --cp-text-muted: #919191; --cp-accent: #fd8ea1; --cp-accent-soft: rgba(253,142,161,0.14); } }
    text { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--cp-text); }
    .mono { font-family: Consolas, "Courier New", Courier, monospace; fill: var(--cp-text-muted); }
    .line { fill: none; stroke: var(--cp-border); stroke-width: 2; }
    .accent { fill: none; stroke: var(--cp-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: var(--cp-surface-soft); stroke: var(--cp-border); stroke-width: 1.5; }
  </style>
