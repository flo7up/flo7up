<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="240" viewBox="0 0 1304 240" role="img" aria-labelledby="title desc">
  <title id="title">Rankoon and PerpXray</title>
  <desc id="desc">Decorative project cards for crypto research and read-only trading analytics. The abstract chart and trade records do not represent live data or investment performance.</desc>
  <style>
    :root { color-scheme: light; --cp-surface: #ffffff; --cp-surface-soft: #f5f5f5; --cp-border: #dedede; --cp-text: #242424; --cp-text-muted: #5c5c5c; --cp-accent: #b11f4b; --cp-accent-soft: rgba(177,31,75,0.08); }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --cp-surface: #292929; --cp-surface-soft: #2e2e2e; --cp-border: #474747; --cp-text: #dedede; --cp-text-muted: #919191; --cp-accent: #fd8ea1; --cp-accent-soft: rgba(253,142,161,0.14); } }
    text { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--cp-text); }
    .label { font-family: Consolas, "Courier New", Courier, monospace; fill: var(--cp-text-muted); font-size: 14px; letter-spacing: 1px; }
    .line { fill: none; stroke: var(--cp-border); stroke-width: 2; }
    .accent { fill: none; stroke: var(--cp-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g>
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">LIVE PRODUCT</text>
    <text x="28" y="101" font-size="42" font-weight="600" letter-spacing="-1">Rankoon</text>
    <text x="30" y="138" font-size="18">Signals. Rankings. Research.</text>
    <rect x="28" y="175" width="104" height="30" rx="8" fill="var(--cp-accent-soft)" />
    <text x="42" y="195" class="label">ML RANKING</text>
    <rect x="381" y="42" width="229" height="156" rx="12" fill="var(--cp-surface-soft)" />
    <path class="line" d="M398 78 H594 M398 118 H594 M398 158 H594 M438 58 V183 M498 58 V183 M558 58 V183" />
    <path class="accent" d="M398 146 L429 121 L460 133 L491 94 L525 108 L558 72 L592 85" />
    <circle cx="558" cy="72" r="5" fill="var(--cp-accent)" />
    <rect x="408" y="171" width="44" height="8" rx="4" fill="var(--cp-border)" />
    <rect x="464" y="171" width="44" height="8" rx="4" fill="var(--cp-border)" />
    <rect x="520" y="171" width="44" height="8" rx="4" fill="var(--cp-accent)" />
  </g>
  <g transform="translate(664 0)">
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">LIVE PRODUCT</text>
    <text x="28" y="101" font-size="42" font-weight="600" letter-spacing="-1">PerpXray</text>
    <text x="30" y="138" font-size="18">Understand your trading.</text>
    <rect x="28" y="175" width="102" height="30" rx="8" fill="var(--cp-accent-soft)" />
    <text x="42" y="195" class="label">READ ONLY</text>
    <rect x="383" y="59" width="78" height="116" rx="12" fill="var(--cp-surface-soft)" stroke="var(--cp-border)" />
    <path class="line" d="M399 81 H445 M399 108 H445 M399 135 H432" />
    <circle cx="519" cy="107" r="55" fill="var(--cp-accent-soft)" />
    <circle cx="519" cy="107" r="44" class="accent" />
    <path class="accent" d="M551 139 L591 179 M494 110 L507 110 L514 91 L526 125 L535 107 L545 107" />
    <path class="line" d="M476 169 H521 M476 185 H550" />
    <circle cx="588" cy="189" r="4" fill="var(--cp-accent)" />
  </g>
</svg>