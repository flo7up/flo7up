<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="240" viewBox="0 0 1304 240" role="img" aria-labelledby="title desc">
  <title id="title">Swiss German Voice Benchmark and AIUseCaseHub MCP</title>
  <desc id="desc">Decorative project cards for eight-dialect speech evaluation and source-linked enterprise AI tools. No benchmark scores are shown.</desc>
  <style>
    :root { color-scheme: light; --cp-surface: #ffffff; --cp-surface-soft: #f5f5f5; --cp-border: #dedede; --cp-text: #242424; --cp-text-muted: #5c5c5c; --cp-accent: #b11f4b; --cp-accent-soft: rgba(177,31,75,0.08); }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --cp-surface: #292929; --cp-surface-soft: #2e2e2e; --cp-border: #474747; --cp-text: #dedede; --cp-text-muted: #919191; --cp-accent: #fd8ea1; --cp-accent-soft: rgba(253,142,161,0.14); } }
    text { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--cp-text); }
    .label { font-family: Consolas, "Courier New", Courier, monospace; fill: var(--cp-text-muted); font-size: 14px; letter-spacing: 1px; }
    .line { fill: none; stroke: var(--cp-border); stroke-width: 2; }
    .accent { fill: none; stroke: var(--cp-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .wave { stroke-width: 5; }
    .node { fill: var(--cp-surface-soft); stroke: var(--cp-border); stroke-width: 1.5; }
  </style>
  <g>
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">SPEECH EVALUATION</text>
    <text x="28" y="94" font-size="34" font-weight="600" letter-spacing="-0.5">Swiss German</text>
    <text x="28" y="133" font-size="34" font-weight="600" letter-spacing="-0.5">Voice Benchmark</text>
    <text x="30" y="194" class="label">8 DIALECTS / WER / CER</text>
    <rect x="386" y="66" width="222" height="124" rx="12" fill="var(--cp-surface-soft)" />
    <path class="line" d="M399 127 H594" />
    <path class="accent wave" d="M408 115 V139 M430 102 V152 M452 83 V171 M474 110 V144 M496 96 V158 M518 78 V176 M540 106 V148 M562 115 V139" />
    <rect x="552" y="35" width="44" height="44" rx="10" fill="var(--cp-accent-soft)" />
    <path d="M569 43 H579 V52 H588 V62 H579 V71 H569 V62 H560 V52 H569 Z" fill="var(--cp-accent)" />
  </g>
  <g transform="translate(664 0)">
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">AGENT TOOLS</text>
    <text x="28" y="94" font-size="34" font-weight="600" letter-spacing="-0.5">AIUseCaseHub</text>
    <text x="28" y="136" font-size="36" font-weight="600">MCP</text>
    <text x="30" y="194" class="label">SEARCH / RETRIEVE / GROUND</text>
    <path class="line" d="M422 59 L501 119 L579 66 M501 119 L579 184 M501 119 L418 182" />
    <circle cx="501" cy="119" r="32" fill="var(--cp-accent-soft)" stroke="var(--cp-accent)" stroke-width="2" />
    <path class="accent" d="M488 110 L501 102 L514 110 V127 L501 135 L488 127 Z" />
    <rect x="396" y="35" width="48" height="48" rx="10" class="node" />
    <circle cx="416" cy="56" r="8" class="accent" />
    <path class="accent" d="M422 62 L432 72" />
    <rect x="555" y="42" width="48" height="48" rx="10" class="node" />
    <path class="accent" d="M568 54 H587 V78 H568 Z M572 61 H582 M572 68 H582" />
    <rect x="555" y="160" width="48" height="48" rx="10" class="node" />
    <path class="accent" d="M568 184 L576 192 L590 175" />
