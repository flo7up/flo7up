<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="240" viewBox="0 0 1304 240" role="img" aria-labelledby="title desc">
  <title id="title">Milo and SWE-RL Forge Lite</title>
  <desc id="desc">Decorative project cards for an in-progress robotics simulator and reproducible coding-agent evaluation, using a mobile robot, pull-request branch, and test checklist.</desc>
  <style>
    :root { color-scheme: light; --cp-surface: #ffffff; --cp-surface-soft: #f5f5f5; --cp-border: #dedede; --cp-text: #242424; --cp-text-muted: #5c5c5c; --cp-accent: #b11f4b; --cp-accent-soft: rgba(177,31,75,0.08); }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --cp-surface: #292929; --cp-surface-soft: #2e2e2e; --cp-border: #474747; --cp-text: #dedede; --cp-text-muted: #919191; --cp-accent: #fd8ea1; --cp-accent-soft: rgba(253,142,161,0.14); } }
    text { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--cp-text); }
    .label { font-family: Consolas, "Courier New", Courier, monospace; fill: var(--cp-text-muted); font-size: 14px; letter-spacing: 1px; }
    .line { fill: none; stroke: var(--cp-border); stroke-width: 2; stroke-linecap: round; }
    .accent { fill: none; stroke: var(--cp-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g>
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">EMBODIED AGENTS</text>
    <text x="28" y="101" font-size="44" font-weight="600" letter-spacing="-1">Milo</text>
    <text x="30" y="138" font-size="18">Experimental robot lab.</text>
    <text x="30" y="194" class="label">SIMULATION / TELEMETRY</text>
    <path class="line" d="M385 205 H599 M400 67 Q450 22 501 43 M413 79 Q450 45 484 59" />
    <path class="accent" d="M385 189 H427 Q443 189 443 172 V153" stroke-dasharray="4 7" />
    <rect x="473" y="93" width="110" height="81" rx="16" fill="var(--cp-accent-soft)" stroke="var(--cp-border)" stroke-width="2" />
    <rect x="490" y="59" width="76" height="63" rx="16" fill="var(--cp-surface-soft)" stroke="var(--cp-accent)" stroke-width="2" />
    <path class="accent" d="M528 45 V58 M511 108 H545 M483 139 H572" />
    <circle cx="528" cy="39" r="5" fill="var(--cp-accent)" />
    <circle cx="510" cy="85" r="5" fill="var(--cp-accent)" />
    <circle cx="546" cy="85" r="5" fill="var(--cp-accent)" />
    <circle cx="494" cy="181" r="13" fill="var(--cp-surface-soft)" stroke="var(--cp-border)" stroke-width="2" />
    <circle cx="562" cy="181" r="13" fill="var(--cp-surface-soft)" stroke="var(--cp-border)" stroke-width="2" />
    <circle cx="443" cy="146" r="5" fill="var(--cp-accent)" />
  </g>
  <g transform="translate(664 0)">
    <rect x="1" y="1" width="638" height="238" rx="16" fill="var(--cp-surface)" stroke="var(--cp-border)" />
    <text x="28" y="42" class="label">CODING-AGENT EVALUATION</text>
    <text x="28" y="94" font-size="36" font-weight="600" letter-spacing="-0.5">SWE-RL</text>
    <text x="28" y="136" font-size="36" font-weight="600" letter-spacing="-0.5">Forge Lite</text>
    <text x="30" y="194" class="label">REPRODUCIBLE SOFTWARE TASKS</text>
    <rect x="506" y="50" width="97" height="137" rx="12" fill="var(--cp-surface-soft)" stroke="var(--cp-border)" />
    <path class="line" d="M544 83 H583 M544 118 H583 M544 153 H583" />
    <path class="accent" d="M520 80 L526 86 L535 74 M520 115 L526 121 L535 109 M520 150 L526 156 L535 144" />
    <path class="accent" d="M408 72 V171 M456 72 V102 Q456 124 433 124 H408" />
    <circle cx="408" cy="63" r="9" fill="var(--cp-accent-soft)" stroke="var(--cp-accent)" stroke-width="2.5" />
    <circle cx="456" cy="63" r="9" fill="var(--cp-accent-soft)" stroke="var(--cp-accent)" stroke-width="2.5" />
    <circle cx="408" cy="181" r="9" fill="var(--cp-accent-soft)" stroke="var(--cp-accent)" stroke-width="2.5" />
  </g>
</svg>